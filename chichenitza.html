<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chichén Itzá - Lugares Famosos en México</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="chichen.css"> <!-- Enlace al archivo CSS externo -->
</head>
<body>

  <div class="container">
    <h1 class="place-title">Chichén Itzá</h1>
    <p>Una de las nuevas siete maravillas del mundo, ubicada en la península de Yucatán.</p>

    <div id="carouselChichenItza" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://traveldigg.com/wp-content/uploads/2016/09/Chichen-Itza-Photo-Mexico.jpg" class="d-block w-100" alt="Chichén Itzá 1">
        </div>
        <div class="carousel-item">
          <img src="https://traveldigg.com/wp-content/uploads/2016/09/Chichen-Itza-Cenote-Photo.jpg" class="d-block w-100" alt="Chichén Itzá 2">
        </div>
        <div class="carousel-item">
          <img src="https://traveldigg.com/wp-content/uploads/2016/09/Chichen-Itza-Cenote-Stage.jpg" class="d-block w-100" alt="Chichén Itzá 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselChichenItza" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselChichenItza" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>

    <a href="index.html" class="btn btn-secondary back-link">Regresar al Menú Principal</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
