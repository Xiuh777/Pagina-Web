<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancún - Lugares Famosos en México</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css"> <!-- Enlace al archivo CSS externo -->
</head>
<body>

  <div class="container">
    <h1 class="place-title">Cancún</h1>
    <p>El paraíso del Caribe mexicano, famoso por sus playas de arena blanca, aguas turquesas y una vida nocturna vibrante.</p>

    <div id="carouselCancun" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://www.bookaway.com/blog/wp-content/uploads/2023/01/cancun-feature.jpg" class="d-block w-100" alt="Cancún 1">
        </div>
        <div class="carousel-item">
          <img src="https://www.fodors.com/wp-content/uploads/2020/01/SEO_BestBeachesInCancun_shutterstock_556910035.jpg" class="d-block w-100" alt="Cancún 2">
        </div>
        <div class="carousel-item">
          <img src="https://fabianascaranzi.com.br/wp-content/uploads/2017/02/Fachada_xl-cancun.jpg" class="d-block w-100" alt="Cancún 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselCancun" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselCancun" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>

    <a href="index.html" class="back-link">Regresar al Menú Principal</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
