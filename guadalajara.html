<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guadalajara - Lugares Famosos en México</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="guadalajara.css"> <!-- CSS externo -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="place-title">Guadalajara</h1>
    <p class="text-center mb-4">
      La Perla Tapatía, cuna del mariachi y el tequila, con una rica herencia cultural y tradiciones únicas.
    </p>

    <div id="carouselCDMX" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://mediaim.expedia.com/destination/1/ae0ecc39f7d0a20805fca7dddc14e31d.jpg" class="d-block w-100" alt="Guadalajara 1">
        </div>
        <div class="carousel-item">
          <img src="https://dplnews.com/wp-content/uploads/2021/11/dplnews_guadalajara_mc261121.jpeg" class="d-block w-100" alt="Guadalajara 2">
        </div>
        <div class="carousel-item">
          <img src="https://vuelaalavida.com/wp-content/uploads/2023/08/catedral-guadalajara-09-8-1024x768-1.jpg" class="d-block w-100" alt="Guadalajara 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselCDMX" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselCDMX" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>

    <a href="index.html" class="btn btn-custom">Regresar al Menú Principal</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
