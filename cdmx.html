<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudad de México - Lugares Famosos en México</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="cdmx.css"> <!-- Enlace al CSS externo -->
</head>
<body>

  <div class="container">
    <h1 class="place-title">Ciudad de México</h1>

    <div id="carouselCDMX" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://www.civitatis.com/blog/wp-content/uploads/2022/12/que-hacer-ciudad-mexico-noche-1536x896.jpg" class="d-block w-100" alt="Ciudad de México 1">

        <div class="carousel-item">
          <img src="https://www.civitatis.com/blog/wp-content/uploads/2022/12/zocalo-ciudad-mexico-noche.jpg" class="d-block w-100" alt="Ciudad de México 2">
        </div>
        <div class="carousel-item">
          <img src="https://www.civitatis.com/blog/wp-content/uploads/2022/12/torre-latinoamericana-noche.jpg" class="d-block w-100" alt="Ciudad de México 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselCDMX" data-bs-slide="prev">
